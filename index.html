<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAFC" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are self-hosted (see scripts/fetch-fonts.mjs). Preloading the two
         faces used above the fold removes them from the critical chain. -->
    <link
      rel="preload"
      href="/fonts/clash-display-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Applied before first paint so the theme never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('sw-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = stored || (prefersLight ? 'light' : 'dark')
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* private mode / storage blocked — dark stays as authored */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
